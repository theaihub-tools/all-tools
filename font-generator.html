  <meta charset="UTF-8">

  <title>स्टाइलिश फॉन्ट जेनरेटर | Fancy Font Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .generator-card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 24px;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #58a6ff;
      font-size: 22px;
    }
    p.subtitle {
      text-align: center;
      color: #8b949e;
      font-size: 13px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 16px;
      color: #f0f6fc;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #58a6ff;
    }
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .result-row {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .font-info {
      flex: 1;
      overflow: hidden;
    }
    .font-name {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 4px;
    }
    .font-output {
      font-size: 17px;
      color: #f0f6fc;
      white-space: nowrap;
      overflow-x: auto;
    }
    .copy-btn {
      padding: 8px 14px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }
    .copy-btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="generator-card">
    <h2>स्टाइलिश फॉन्ट जेनरेटर</h2>
    <p class="subtitle">यहाँ अपना नाम या टेक्स्ट लिखें और मनपसंद फॉन्ट कॉपी करें</p>

    <input type="text" id="userInput" placeholder="यहाँ टेक्स्ट लिखें (उदा. Dikshit Panchal)..." oninput="generateFonts()">

    <div class="results-list" id="resultsList"></div>
  </div>
<footer style="text-align: center; padding: 25px 15px; border-top: 1px solid #e0e0e0; margin-top: 50px; background-color: #f8f9fa; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.8;">
    <p style="margin: 0 0 10px 0; color: #555;">

        <a href="terms.html" style="color: #007bff; text-decoration: none; margin: 0 8px;">Terms & Conditions</a>
    </p>
</footer>

  <script>
    const normalChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    const fontStyles = [
      {
        name: "Bold (मोटा)",
        chars: "𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵"
      },
      {
        name: "Italic (तिरछा)",
        chars: "𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡0123456789"
      },
      {
        name: "Bold Italic",
        chars: "𝙖𝙗𝙘𝙙𝙚𝙛𝙜𝙝𝙞𝙟𝙠𝙡𝙢𝙣𝙤𝙥𝙦𝙧𝙨𝙩𝙪𝙫𝙬𝙭𝙮𝙯𝘼𝘽𝘾𝘿𝙀𝙁𝙂𝙃𝙄𝙅𝙆𝙇𝙈𝙉𝙊𝙋𝙌𝙍𝙎𝙏𝙐𝙑𝙒𝙓𝙔𝙕𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵"
      },
      {
        name: "Monospace / Code",
        chars: "𝚊𝚋𝚌𝚍𝚎𝚏𝚐𝚑𝚒𝚓𝚔𝚕𝚖𝚗𝚘𝚙𝚚𝚛𝚜𝚝𝚞𝚟𝚠𝚡𝚢𝚣𝙰𝙱𝙲𝙳𝙴𝙵𝙶𝙷𝙸𝙹𝙺𝙻𝙼𝙽𝙾𝙿𝚀𝚁𝚂𝚃𝚄𝚅𝚆𝚇𝚈𝚉𝟶𝟷𝟸𝟹𝟺𝟻𝟼𝟽𝟾𝟿"
      },
      {
        name: "Circle / Bubble",
        chars: "ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ⓪①②③④⑤⑥⑦⑧⑨"
      },
      {
        name: "Gothic / Old English",
        chars: "𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ0123456789"
      },
      {
        name: "Cursive / Script",
        chars: "𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵0123456789"
      }
    ];

    function convertText(text, targetChars) {
      const source = Array.from(normalChars);
      const target = Array.from(targetChars);
      return Array.from(text).map(char => {
        const index = source.indexOf(char);
        return index !== -1 ? target[index] : char;
      }).join('');
    }

    function generateFonts() {
      const input = document.getElementById('userInput').value;
      const list = document.getElementById('resultsList');
      const sampleText = input.trim() === '' ? 'Preview Text' : input;

      list.innerHTML = '';

      fontStyles.forEach(style => {
        const styledText = convertText(sampleText, style.chars);

        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `
          <div class="font-info">
            <div class="font-name">${style.name}</div>
            <div class="font-output">${styledText}</div>
          </div>
          <button class="copy-btn" onclick="copyValue('${styledText.replace(/'/g, "\\'")}', this)">Copy</button>
        `;
        list.appendChild(row);
      });
    }

    function copyValue(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerText;
        btn.innerText = 'Copied!';
        btn.style.backgroundColor = '#388bfd';
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.backgroundColor = '#238636';
        }, 1200);
      });
    }

    // शुरुआती प्रीव्यू लोड करें
    generateFonts();
  </script>
</body>
</html>
