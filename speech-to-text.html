  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>वॉइस टाइपिंग | Speech to Text</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .voice-card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 24px;
      border-radius: 12px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #58a6ff;
      font-size: 22px;
    }
    p.subtitle {
      text-align: center;
      color: #8b949e;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .settings-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    select {
      flex: 1;
      padding: 10px 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 14px;
      color: #f0f6fc;
      outline: none;
    }
    select:focus {
      border-color: #58a6ff;
    }
    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 15px;
      color: #f0f6fc;
      outline: none;
      resize: vertical;
      line-height: 1.5;
    }
    textarea:focus {
      border-color: #58a6ff;
    }
    .status-text {
      font-size: 13px;
      color: #8b949e;
      margin: 10px 0 16px 0;
      text-align: center;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
    }
    button {
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #30363d;
      background-color: #21262d;
      color: #c9d1d9;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #30363d;
      color: #f0f6fc;
    }
    .btn-mic {
      background-color: #238636;
      border-color: #238636;
      color: #fff;
    }
    .btn-mic:hover {
      background-color: #2ea043;
    }
    .btn-mic.listening {
      background-color: #da3633;
      border-color: #da3633;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .btn-copy {
      background-color: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }
    .btn-copy:hover {
      background-color: #388bfd;
    }
  </style>
</head>
<body>

  <div class="voice-card">
    <h2>वॉइस टाइपिंग (Speech to Text)</h2>
    <p class="subtitle">माइक चालू करें और बोलकर आसानी से टाइप करें</p>

    <div class="settings-row">
      <select id="langSelect">
        <option value="hi-IN" selected>हिंदी (Hindi)</option>
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
      </select>
    </div>

    <textarea id="outputArea" placeholder="आप जो बोलेंगे वह यहाँ टाइप होगा..."></textarea>
    <div class="status-text" id="status">माइक बंद है। शुरू करने के लिए बटन दबाएँ।</div>

    <div class="btn-grid">
      <button id="micBtn" class="btn-mic" onclick="toggleListening()">Start Mic</button>
      <button class="btn-copy" onclick="copySpeechText()">Copy</button>
      <button onclick="clearSpeechText()">Clear</button>
    </div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const outputArea = document.getElementById('outputArea');
    const langSelect = document.getElementById('langSelect');

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        micBtn.innerText = 'Stop Mic';
        micBtn.classList.add('listening');
        statusText.innerText = 'सुन रहा हूँ... बोलिए...';
        statusText.style.color = '#3fb950';
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        outputArea.value = transcript;
      };

      recognition.onerror = (event) => {
        statusText.innerText = 'त्रुटि (Error): ' + event.error;
        statusText.style.color = '#da3633';
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      micBtn.disabled = true;
      statusText.innerText = 'आपके ब्राउज़र में वॉइस टाइपिंग सपोर्टेड नहीं है। (Chrome/Edge इस्तेमाल करें)';
      statusText.style.color = '#da3633';
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
        stopListening();
      } else {
        recognition.lang = langSelect.value;
        recognition.start();
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.innerText = 'Start Mic';
      micBtn.classList.remove('listening');
      statusText.innerText = 'माइक बंद है।';
      statusText.style.color = '#8b949e';
    }

    function copySpeechText() {
      if (!outputArea.value) return;
      navigator.clipboard.writeText(outputArea.value).then(() => {
        alert('टेक्स्ट कॉपी हो गया है!');
      });
    }

    function clearSpeechText() {
      outputArea.value = '';
    }
  </script>
</body>
</html>
