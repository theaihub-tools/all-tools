<html lang="hi">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password Generator Online | Free Random Password Maker</title>
    <meta name="description" content="Generate strong, secure, and random passwords online for free. Customize password length, numbers, symbols, and letters to protect your accounts.">
    <meta name="keywords" content="password generator, strong password generator, random password maker, secure password generator, online password creator">

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; max-width: 480px; width: 100%; padding: 24px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 22px; color: #1a202c; margin-top: 0; margin-bottom: 6px; }
        p.subtitle { color: #4a5568; font-size: 13px; margin-top: 0; margin-bottom: 20px; }

        .result-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 16px; font-weight: bold; color: #2d3748; letter-spacing: 1px; outline: none; }
        .btn-copy { background: #38a169; color: white; border: none; border-radius: 8px; padding: 0 16px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-copy:hover { background: #2f855a; }

        .settings { text-align: left; background: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #edf2f7; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; color: #2d3748; }
        .setting-row:last-child { margin-bottom: 0; }
        input[type="range"] { width: 50%; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        button.btn-generate { width: 100%; background: #3182ce; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.btn-generate:hover { background: #2b6cb0; }

        .seo-text { text-align: left; font-size: 12px; color: #718096; margin-top: 25px; border-top: 1px solid #edf2f7; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Strong Password Generator</h1>
    <p class="subtitle">अपने सोशल मीडिया और बैंक खातों के लिए सुरक्षित पासवर्ड बनाएँ</p>

    <div class="result-box">
        <input type="text" id="passwordOutput" readonly placeholder="पासवर्ड यहाँ दिखेगा">
        <button class="btn-copy" onclick="copyPassword()">कॉपी करें</button>
    </div>

    <div class="settings">
        <div class="setting-row">
            <span>पासवर्ड की लंबाई: <strong id="lengthVal">12</strong></span>
            <input type="range" id="lengthSlider" min="6" max="32" value="12" oninput="updateLength(this.value)">
        </div>
        <div class="setting-row">
            <label for="incUpper">बड़े अक्षर (A-Z)</label>
            <input type="checkbox" id="incUpper" checked>
        </div>
        <div class="setting-row">
            <label for="incNumbers">अंक (0-9)</label>
            <input type="checkbox" id="incNumbers" checked>
        </div>
        <div class="setting-row">
            <label for="incSymbols">चिह्न (!@#$%^&*)</label>
            <input type="checkbox" id="incSymbols" checked>
        </div>
    </div>

    <button class="btn-generate" onclick="generatePassword()">नया पासवर्ड बनाएँ</button>

    <div class="seo-text">
        <strong>सुरक्षा फीचर्स:</strong>
        <ul>
            <li>ब्राउज़र में सीधे जनरेट होता है (100% प्राइवेट)</li>
            <li>हैकिंग और डेटा लीक से खातों को सुरक्षित रखें</li>
            <li>कस्टम लंबाई और चिह्नों का आसान चुनाव</li>
        </ul>
    </div>
</div>

<script>
    function updateLength(val) {
        document.getElementById("lengthVal").innerText = val;
    }

    function generatePassword() {
        const length = document.getElementById("lengthSlider").value;
        const incUpper = document.getElementById("incUpper").checked;
        const incNumbers = document.getElementById("incNumbers").checked;
        const incSymbols = document.getElementById("incSymbols").checked;

        const lowerChars = "abcdefghijklmnopqrstuvwxyz";
        const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numberChars = "0123456789";
        const symbolChars = "!@#$%^&*()_+~|}{[]:;?><,.-=";

        let charPool = lowerChars;
        if (incUpper) charPool += upperChars;
        if (incNumbers) charPool += numberChars;
        if (incSymbols) charPool += symbolChars;

        let password = "";
        for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(Math.random() * charPool.length);
            password += charPool[randomIndex];
        }

        document.getElementById("passwordOutput").value = password;
    }

    function copyPassword() {
        const pass = document.getElementById("passwordOutput");
        if (!pass.value) {
            alert("पहले पासवर्ड बनाएँ!");
            return;
        }
        navigator.clipboard.writeText(pass.value).then(() => {
            alert("पासवर्ड कॉपी हो गया!");
        });
    }

    // पेज खुलते ही एक पासवर्ड दिखे
    generatePassword();
</script>

</body>
</html>
